<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StatPro Motion Diagram Studio (다이어그램 & 인포그래픽 스튜디오)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: 'Pretendard', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .studio-bar {
      height: 60px;
      background-color: #111827;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 16px;
      z-index: 100;
      flex-shrink: 0;
    }
    
    .studio-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    
    .studio-logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #ffffff;
    }
    
    .studio-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }
    
    .studio-subtitle {
      font-size: 10px;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
    }
    
    .theme-selector-group {
      display: flex;
      align-items: center;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 4px;
      gap: 3px;
      overflow-x: auto;
      max-width: 960px;
    }
    
    .theme-btn {
      padding: 6px 11px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      font-family: 'Pretendard', sans-serif;
      white-space: nowrap;
    }
    
    .theme-btn:hover {
      color: #f8fafc;
      background-color: rgba(255, 255, 255, 0.05);
    }
    
    .theme-btn.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 2px 5px rgba(37, 99, 235, 0.4);
    }
    
    .actions-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-action {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: #334155;
      color: #ffffff;
    }
    
    .viewport-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
      background-color: #0b1120;
    }
    
    iframe.preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <header class="studio-bar">
    <div class="studio-brand">
      <div class="studio-logo">✦</div>
      <div>
        <div class="studio-title">Motion Diagram Studio</div>
        <div class="studio-subtitle">10대 인포그래픽 &amp; 다이어그램 테마 선택기</div>
      </div>
    </div>

    <!-- Theme Switcher -->
    <div class="theme-selector-group">
      <button class="theme-btn active" data-src="statpro_system_and_workflow_motion.html" onclick="switchTheme(this)">
        ⭐ 전체 시스템 구성도 &amp; 업무플로우
      </button>
      <button class="theme-btn" data-src="statpro_swimlane_workflow.html" onclick="switchTheme(this)">
        🏢 3단 스윔레인 플로우
      </button>
      <button class="theme-btn" data-src="statpro_alternating_timeline_workflow.html" onclick="switchTheme(this)">
        📍 수평 교차 핀 타임라인
      </button>
      <button class="theme-btn" data-src="statpro_chevron_pipeline_workflow.html" onclick="switchTheme(this)">
        ⏩ 셰브론 파이프라인
      </button>
      <button class="theme-btn" data-src="statpro_roadmap_workflow.html" onclick="switchTheme(this)">
        🛣️ 아스팔트 로드맵
      </button>
      <button class="theme-btn" data-src="statpro_hub_workflow.html" onclick="switchTheme(this)">
        💎 다이아몬드 허브
      </button>
      <button class="theme-btn" data-src="statpro_interlock_workflow.html" onclick="switchTheme(this)">
        🧩 인터로킹 퍼즐 체인
      </button>
      <button class="theme-btn" data-src="statpro_sketch_motion_workflow.html" onclick="switchTheme(this)">
        📝 손글씨 줄노트 스케치
      </button>
      <button class="theme-btn" data-src="statpro_motion_workflow.html" onclick="switchTheme(this)">
        💻 모던 UI 대시보드
      </button>
      <button class="theme-btn" data-src="docs_motion_workflow.html" onclick="switchTheme(this)">
        📖 기술 문서 파이프라인
      </button>
    </div>

    <div class="actions-group">
      <button class="btn-action" onclick="openNewTab()">
        <span>↗ 새 탭</span>
      </button>
      <button class="btn-action" onclick="reloadFrame()">
        <span>↺ 새로고침</span>
      </button>
    </div>
  </header>

  <main class="viewport-container">
    <iframe id="previewFrame" class="preview-frame" src="statpro_system_and_workflow_motion.html"></iframe>
  </main>

  <script>
    let currentSrc = "statpro_system_and_workflow_motion.html";

    function switchTheme(btn) {
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSrc = btn.getAttribute('data-src');
      document.getElementById('previewFrame').src = currentSrc;
    }

    function openNewTab() {
      window.open(currentSrc, '_blank');
    }

    function reloadFrame() {
      const frame = document.getElementById('previewFrame');
      frame.src = frame.src;
    }
  </script>
</body>
</html>
