[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "statpro"
version = "0.6.0"
description = "Local-first statistical quality and engineering analytics core"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "StatPro Team" }]
dependencies = ["pyarrow>=19,<20"]

[project.optional-dependencies]
api = ["fastapi>=0.123,<1", "uvicorn>=0.38,<1"]
test = ["fastapi>=0.123,<1", "httpx2>=2.14,<3", "jsonschema>=4.23,<5"]
identity = ["PyJWT[crypto]>=2.10,<3"]
codex = ["openai-codex"]
advanced = [
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "statsmodels>=0.14,<1",
    "python-docx>=1.1,<2",
]
external-sql = ["psycopg[binary]>=3.3,<4", "pywin32>=307,<308"]

[project.scripts]
statpro = "statpro.cli:main"
statpro-api = "statpro.api.server:main"
statpro-approval-user = "statpro.application.approval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"statpro.schemas" = ["*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
