[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "statpro"
version = "0.6.0"
description = "Local-first statistical quality and engineering analytics core"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "StatPro Team" }]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.123,<1", "uvicorn>=0.38,<1"]
test = ["fastapi>=0.123,<1", "httpx2>=2.14,<3", "jsonschema>=4.23,<5"]

[project.scripts]
statpro = "statpro.cli:main"
statpro-api = "statpro.api.server:main"
statpro-approval-user = "statpro.application.approval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"statpro.schemas" = ["*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
